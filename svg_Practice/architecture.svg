<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1200" version="1.1" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5"><polygon fill="black" points="0,0 10,5 0,10" /></marker></defs><rect fill="#FFDDAA" height="216" stroke="black" stroke-width="2" width="350" x="50" y="50" /><text fill="black" font-size="18px" font-weight="bold" x="60" y="75">고객 모바일 앱 (React Native / Expo)</text><text fill="black" font-size="14px" x="65" y="100">• 로그인 / 회원가입 (Supabase Auth)</text><text fill="black" font-size="14px" x="65" y="120">• 예약 조회 / 생성 / 취소</text><text fill="black" font-size="14px" x="65" y="140">• 정액제(수업권) 조회</text><text fill="black" font-size="14px" x="65" y="160">• 개인 피드백 확인</text><text fill="black" font-size="14px" x="65" y="180">• 결제 페이지 이동 (Toss / KG)</text><text fill="black" font-size="14px" x="65" y="200">• 푸시 알림 수신 (FCM / APNs)</text><rect fill="#AAEEFF" height="172" stroke="black" stroke-width="2" width="350" x="50" y="300" /><text fill="black" font-size="18px" font-weight="bold" x="60" y="325">Supabase (Auth / Postgres / Storage)</text><text fill="black" font-size="14px" x="65" y="350">• Auth: 이메일/휴대폰/OAuth 로그인</text><text fill="black" font-size="14px" x="65" y="370">• DB: 회원, 예약, 결제, 정액제, 피드백 관리</text><text fill="black" font-size="14px" x="65" y="390">• Storage: 영상 / 이미지 파일 저장</text><text fill="black" font-size="14px" x="65" y="410">• Edge Functions: 필요 시 서버 로직</text><rect fill="#DDEEFF" height="238" stroke="black" stroke-width="2" width="350" x="500" y="200" /><text fill="black" font-size="18px" font-weight="bold" x="510" y="225">FastAPI 백엔드 (Python)</text><text fill="black" font-size="14px" x="515" y="250">• 예약 관리: 생성/조회/변경/취소, 중복 확인, 예약 알림</text><text fill="black" font-size="14px" x="515" y="270">• 정액제/구독 관리: 차감/갱신/만료, 자동 알림</text><text fill="black" font-size="14px" x="515" y="290">• 결제 처리: 요청 전송 / 상태 관리</text><text fill="black" font-size="14px" x="515" y="310">• 알림/푸시: 예약, 정액제, 개인 알림</text><text fill="black" font-size="14px" x="515" y="330">• DB 읽기/쓰기</text><text fill="black" font-size="14px" x="515" y="350">• Storage URL 발급</text><text fill="black" font-size="14px" x="515" y="370">• Background Worker / Scheduler</text><rect fill="#FFEEDD" height="150" stroke="black" stroke-width="2" width="350" x="520" y="288" /><text fill="black" font-size="18px" font-weight="bold" x="530" y="313">외부 서비스 연동</text><text fill="black" font-size="14px" x="535" y="338">• Toss / KG 결제</text><text fill="black" font-size="14px" x="535" y="358">• KakaoTalk / SMS 알림</text><text fill="black" font-size="14px" x="535" y="378">• FCM / APNs 푸시</text><rect fill="#CCFFCC" height="194" stroke="black" stroke-width="2" width="350" x="500" y="488" /><text fill="black" font-size="18px" font-weight="bold" x="510" y="513">관리자 웹 (Next.js / Vercel)</text><text fill="black" font-size="14px" x="515" y="538">• 고객 관리: 회원 정보, 이용 내역</text><text fill="black" font-size="14px" x="515" y="558">• 예약 관리: 스케줄 확인 / 수정 / 취소</text><text fill="black" font-size="14px" x="515" y="578">• 정액제 / 결제 관리</text><text fill="black" font-size="14px" x="515" y="598">• 피드백 업로드 (영상/사진)</text><text fill="black" font-size="14px" x="515" y="618">• 대시보드 / 통계 확인</text><line marker-end="url(#arrow)" stroke="black" stroke-width="2" x1="400" x2="500" y1="150" y2="300" /><line marker-end="url(#arrow)" stroke="black" stroke-width="2" x1="250" x2="250" y1="300" y2="350" /><line marker-end="url(#arrow)" stroke="black" stroke-width="2" x1="400" x2="500" y1="390" y2="390" /><line marker-end="url(#arrow)" stroke="black" stroke-width="2" x1="675.0" x2="675.0" y1="438" y2="488" /></svg>